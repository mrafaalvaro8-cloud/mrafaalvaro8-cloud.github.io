name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
